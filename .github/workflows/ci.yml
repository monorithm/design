# CI: the checks of the language source on each pull request and each push to main.
#   typecheck   the compiler
#   test        the tests of the compiler
#   check       the drift check: the committed ir/<version>/ must match the source
# Each action has a full commit SHA and a comment with its version.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type check, test, and drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Node 26 does not include Corepack. Corepack reads the field packageManager of package.json.
      - name: Install Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install the dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Drift check of the IR
        run: yarn check
